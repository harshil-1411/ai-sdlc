# Continuous integration and continuous testing — reference shape.
# Translate to whatever CI system .evidence/context/deployment.md says you actually use.
# The stage design matters; the syntax does not.

stages:

  commit:
    trigger: push to any branch
    blocks: true
    steps:
      - build                      # from stack.md, must exit non-zero on failure
      - unit tests
      - integration tests
      - secret scan
      - SAST
      - dependency + licence scan
      - traceability check         # tracker key present in branch and commits
    evidence: build log, test report, scan reports

  pull_request:
    trigger: PR opened or updated
    blocks: tests yes; agent findings advisory
    steps:
      - everything from commit
      - contract tests             # integration boundaries
      - e2e smoke                  # thin: critical journeys only
      - accessibility checks
      - agent review passes        # bugs / security / conformance to plan.md
      - compliance pass            # ONLY when the diff touches regulated paths
    evidence: reports attached to the PR; findings inform the human reviewer

  merge:
    trigger: merge to the protected branch
    blocks: true
    steps:
      - full build, artifact, SBOM, sign
      - publish to registry
    evidence: signed artifact + SBOM

  deploy_test:
    trigger: successful merge
    blocks: true
    steps:
      - deploy to the test environment
      - post-deploy smoke
      - full e2e regression
      - API regression
      - post results to the test management system   # run named with tracker key + build
    evidence: test run recorded against test cases, reachable from the tracker key

  nightly:
    trigger: schedule
    blocks: false
    steps:
      - full regression
      - performance
      - extended security scan
      - dependency drift
      - flake detection            # rerun recent failures, classify
      - partner sandbox canary     # small: proves credentials and endpoints still live
    evidence: trend reports

  agent_config_evals:
    trigger: change to CLAUDE.md, skills, hooks, or the model pin
    blocks: true
    steps:
      - run the eval suite (20-50 real tasks + one per past incident)
      - compare pass rate to baseline; examine regulated-path cases individually
    evidence: eval run recorded on the PR
    note: this is the acceptance test for a change to the agent's configuration

  pre_release:
    trigger: release candidate
    blocks: true
    steps:
      - full regression
      - manual / UAT run executed by named testers
      - validation evidence assembly + traceability export
      - compliance sign-off
    evidence: release test run, traceability matrix, signed validation package

  post_deploy:
    trigger: any deployment
    blocks: true
    steps:
      - health and smoke probes
      - key business-journey probes
      - rollback on breach
    evidence: deployment record

guardrails:
  commit_stage_duration: keep under 10 minutes or people stop waiting for it
  blocking_findings: compilation, unit/integration failure, secrets, critical+high
                     security, contract failure, regulated-path coverage drop
  advisory_findings:  style, agent review comments, non-critical scan findings
  never: gate a merge on an automatically-counted findings total — it will be gamed
  rollback: rehearse on a schedule in a lower environment; record the date
