<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Evidence Chain</title>
  <desc id="desc">Evidence Chain: AI agents write the code, and every change still proves itself. On the right, real gate engine output: a write before plan approval is denied, a human approves the exact plan by its sha256, and the same write is then allowed.</desc>

  <rect width="1200" height="400" rx="24" fill="#0E1116"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="56" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2" fill="#D9A441">CLAUDE CODE PLUGINS · SDLC CONTROL PLANE</text>
    <text x="54" y="156" font-size="66" font-weight="700" fill="#EDE8DC">Evidence Chain</text>
    <text x="56" y="208" font-size="28" fill="#EDE8DC">AI agents write the code.</text>
    <text x="56" y="246" font-size="28" fill="#9AA3AD">Every change still proves itself.</text>
  </g>

  <g id="chain" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" text-anchor="middle">
    <g stroke="#3A424D" stroke-width="2">
      <line x1="144" y1="310" x2="152" y2="310"/><line x1="240" y1="310" x2="248" y2="310"/>
      <line x1="336" y1="310" x2="344" y2="310"/><line x1="432" y1="310" x2="440" y2="310"/>
      <line x1="528" y1="310" x2="536" y2="310"/>
    </g>
    <rect x="56"  y="290" width="88" height="40" rx="8" fill="#161B22" stroke="#3A424D" stroke-width="2"/>
    <rect x="152" y="290" width="88" height="40" rx="8" fill="#161B22" stroke="#3A424D" stroke-width="2"/>
    <rect x="248" y="290" width="88" height="40" rx="8" fill="#161B22" stroke="#D9A441" stroke-width="2"/>
    <rect x="344" y="290" width="88" height="40" rx="8" fill="#161B22" stroke="#3A424D" stroke-width="2"/>
    <rect x="440" y="290" width="88" height="40" rx="8" fill="#161B22" stroke="#3A424D" stroke-width="2"/>
    <rect x="536" y="290" width="96" height="40" rx="8" fill="#161B22" stroke="#D9A441" stroke-width="2"/>
    <g fill="#EDE8DC">
      <text x="100" y="316">intent</text><text x="196" y="316">spec</text>
      <text x="292" y="316" fill="#D9A441">plan</text><text x="388" y="316">diff</text>
      <text x="484" y="316">review</text><text x="584" y="316" fill="#D9A441">release</text>
    </g>
    <text x="56" y="362" text-anchor="start" fill="#7D8590">each stage is a commit · <tspan fill="#D9A441">amber</tspan> = a human signs</text>
  </g>

  <g id="project-proof" transform="translate(676 48)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">
    <rect width="468" height="304" rx="14" fill="#161B22" stroke="#2A313A" stroke-width="2"/>
    <path d="M0 14 a14 14 0 0 1 14 -14 h440 a14 14 0 0 1 14 14 v28 h-468 z" fill="#1E242C"/>
    <circle cx="22" cy="21" r="6" fill="#3A424D"/><circle cx="42" cy="21" r="6" fill="#3A424D"/><circle cx="62" cy="21" r="6" fill="#3A424D"/>
    <text x="84" y="27" fill="#7D8590">PreToolUse hook · AUTH-7</text>
    <text x="20" y="78" fill="#EDE8DC">Write src/auth/mfa.py</text>
    <text x="20" y="108" fill="#E0645A" font-weight="700">✕ denied</text>
    <text x="20" y="136" fill="#9AA3AD">the plan for AUTH-7 has not been</text>
    <text x="20" y="162" fill="#9AA3AD">approved. An agent cannot approve</text>
    <text x="20" y="188" fill="#9AA3AD">its own plan.</text>
    <text x="20" y="226" fill="#D9A441">/evidence-sdlc:approve AUTH-7 69710a…</text>
    <text x="20" y="254" fill="#7D8590">human, bound to the plan's sha256</text>
    <text x="20" y="286" fill="#EDE8DC">Write src/auth/mfa.py <tspan fill="#5FB08A" font-weight="700">✓ allowed</tspan></text>
  </g>
</svg>
