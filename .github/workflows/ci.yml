name: evidence-chain CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      run_evals:
        description: "Run the plugin eval suites (needs the ANTHROPIC_API_KEY secret; costs money)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Shell syntax
        run: |
          set -e
          git ls-files '*.sh' | xargs -r -n1 bash -n

      - name: JSON parses
        run: |
          set -e
          git ls-files '*.json' | grep -v '/evals/results/' | while read -r f; do
            python3 -m json.tool "$f" >/dev/null || { echo "invalid JSON: $f"; exit 1; }
          done

      - name: Python compiles
        run: python3 -m py_compile plugins/evidence-sdlc/scripts/engine/*.py plugins/evidence-quality/scripts/*.py plugins/evidence-sdlc/scripts/cli/*.py

      - name: All suites (engine, lifecycle, sensor, CLI, content) -> fresh JUnit in validation/results
        run: bash scripts/ci/run-tests.sh

      - uses: actions/upload-artifact@v4
        with:
          name: validation-results
          path: validation/results/

      - name: Version bump check
        if: github.event_name == 'pull_request'
        run: bash scripts/ci/check-version-bump.sh "origin/${{ github.base_ref }}"


      - name: Dogfood — audit logs verify
        run: python3 plugins/evidence-sdlc/bin/evidence audit verify

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Plugin manifests validate
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .
          for p in plugins/*/; do claude plugin validate "$p"; done

  sign-and-gate:
    # The key lives only in this job. It runs no test code: it hashes the result files the
    # checks job uploaded, signs them bound to this commit and run, and runs the strict gate.
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: validation-results
          path: validation/results/
      - name: Trusted signer = the base branch's CLI, never the PR's own copy
        run: |
          base="${{ github.base_ref || github.event.repository.default_branch }}"
          git fetch -q origin "$base"
          git worktree add -q ../trusted "origin/$base"
      - name: Signing is required when the repository says so
        if: vars.EVIDENCE_REQUIRE_SIGNED == 'true'
        env:
          HAS_KEY: ${{ secrets.EVIDENCE_SIGNING_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then echo "EVIDENCE_REQUIRE_SIGNED is true but no EVIDENCE_SIGNING_KEY secret"; exit 1; fi
      - name: Sign this run's results (key visible to this step only)
        env:
          EVIDENCE_SIGNING_KEY: ${{ secrets.EVIDENCE_SIGNING_KEY }}
        run: |
          if [ -n "$EVIDENCE_SIGNING_KEY" ]; then python3 ../trusted/plugins/evidence-sdlc/bin/evidence results sign validation/results/*.xml; fi
      - name: Traceability gaps (strict, trusted CLI)
        env:
          EVIDENCE_SIGNING_KEY: ${{ secrets.EVIDENCE_SIGNING_KEY }}
        run: python3 ../trusted/plugins/evidence-sdlc/bin/evidence gaps --strict

  evals:
    if: github.event_name == 'workflow_dispatch' && inputs.run_evals
    runs-on: ubuntu-latest
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        plugin: [evidence-discovery, evidence-sdlc, evidence-quality, evidence-compliance, evidence-integrations]
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run evals (3 runs, with and without the plugin)
        working-directory: plugins/${{ matrix.plugin }}
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin eval . --trust-plugin --scaffold --runs 3 \
            --json results.json --threshold 0.8 --no-publish --max-cost-usd 20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-${{ matrix.plugin }}
          path: plugins/${{ matrix.plugin }}/results.json
